
<!DOCTYPE html>
<html>
<head>
    <title>Product Inventory Dashboard</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Product Inventory Dashboard</h1>
      <p>Manage your products and inventory</p>
      <p>- akriti</p>
    <hr>

    <h2>Inventory Summary</h2>

    <p>Total Products: <span id="totalProducts">0</span></p>

    <p>Total Quantity: <span id="totalQuantity">0</span></p>

    <p>Total Inventory Value: Rs. <span id="totalValue">0</span></p>

    <hr>

<h2 id="addProductHeading">Add New Product</h2>

    <form id="productForm">

        <label>Product Name:</label>
        <input type="text" id="productName" required>
        <br><br>

        <label>Price:</label>
        <input type="number" id="productPrice" min="0.01" step="0.01" required>
        <br><br>

        <label>Quantity:</label>
        <input type="number" id="productQuantity" min="0" required>
        <br><br>

        <label>Category:</label>
        <select id="productCategory" required>
            <option value="">Select Category</option>
            <option value="Electronics">Electronics</option>
            <option value="Furniture">Furniture</option>
            <option value="Clothing">Clothing</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <button type="submit">Add Product</button>

    </form>

    <hr>

    <h2>Product List</h2>

    <label>Search Product:</label>
    <input type="text" id="searchProduct" placeholder="Enter product name">

    <label>Filter by Category:</label>
    <select id="filterCategory">
        <option value="All">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Furniture">Furniture</option>
        <option value="Clothing">Clothing</option>
        <option value="Other">Other</option>
    </select>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Category</th>
                <th>Total Value</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="productTable">
        </tbody>
    </table>

    <script src="script.js"></script>

</body>
</html>
